<div class="wrap">
  <header class="top">
    <h1>四子棋</h1>
    <p>屏風式四子棋：棋子從上面投下去，橫、直、斜先連成四個就贏。</p>
    <a class="home" href="./">← 全部棋類</a>
  </header>
  <div class="stage">
    <svg id="board" viewBox="0 0 700 640" role="img" aria-label="四子棋盤"></svg>
    <div class="fx" id="fx" aria-live="assertive"></div>
  </div>
  <aside class="panel">
    <div class="status" aria-live="polite"><div class="msg" id="msg"></div><div class="sub" id="sub"></div></div>
    <div class="score" id="score"></div>
    <div class="group"><span class="label">玩法</span>
      <div class="seg" id="modeSeg"><button data-mode="local">雙人同機</button><button data-mode="ai">對電腦</button><button data-mode="online">連線對戰</button></div></div>
    <div class="group" id="netBox" hidden></div>
    <div class="group" id="aiOpts"><span class="label">我是</span>
      <div class="seg" id="sideSeg"><button data-first="1">紅（先下）</button><button data-first="0">黃</button></div>
      <span class="label" style="margin-top:6px">電腦棋力</span>
      <div class="seg" id="lvlSeg"><button data-lv="0">入門</button><button data-lv="1">初級</button><button data-lv="2">業餘</button><button data-lv="3">中級</button><button data-lv="4">高級</button><button data-lv="5">進階</button></div></div>
    <div class="actions">
      <button class="btn primary" id="btnNew">新局</button><button class="btn" id="btnUndo">悔棋</button><button class="btn" id="btnGiveUp">認輸</button>
    </div>
    <div class="confirm" id="confirm" hidden><span id="confirmText"></span><button class="btn primary" id="confirmYes">確定</button><button class="btn" id="confirmNo">取消</button></div>
    <details class="rules"><summary>玩法說明</summary>
      <ul>
        <li>棋盤 7 行 6 列，直立擺著。紅先，兩人輪流選一行把棋子投下去，棋子會掉到那一行最下面的空位。</li>
        <li>先讓自己的四顆棋子連成一直線（橫、直、斜都可以）就贏。</li>
        <li>42 格全部下滿還沒有人連成四個就是和局。</li>
        <li>小技巧：中間那一行最重要；同時做出兩個「再一步就連四」的威脅，對手就擋不住。</li>
        <li>點棋盤上任何位置都可以，棋子會投進你點的那一行。</li>
      </ul>
    </details>
  </aside>

<script>
let NETP = null;
/* ───────── 規則與電腦：位元棋盤 + alpha-beta ───────── */
function C4ENGINE() {
  const W = 7, H = 6, H1 = 7;                 // 每行 7 個位元（多一個哨兵）
  const BOTTOM = (() => { let b = 0n; for (let c = 0; c < W; c++) b |= 1n << BigInt(c * H1); return b; })();
  function won(p) {
    for (const d of [1n, 7n, 6n, 8n]) { const m = p & (p >> d); if (m & (m >> (2n * d))) return true; }
    return false;
  }
  /* 狀態：cur（輪到的人的子）、mask（所有子）、n（手數） */
  const canPlay = (s, c) => (s.mask & (1n << BigInt(c * H1 + H - 1))) === 0n;   // 這一行最上面那格還空著
  function play(s, c) {
    const cur = s.cur ^ s.mask;
    const mask = s.mask | (s.mask + (1n << BigInt(c * H1)));
    return { cur, mask, n: s.n + 1 };
  }
  const isWin = (s, c) => { const t = s.cur | ((s.mask + (1n << BigInt(c * H1))) & (0x3Fn << BigInt(c * H1))); return won(t); };
  const ORDER = [3, 2, 4, 1, 5, 0, 6];
  /* 評估：四格窗口裡只有一方的子，2 個 +2、3 個 +5；中間行加分 */
  function evalPos(s) {
    const me = s.cur, op = s.cur ^ s.mask;
    let sc = 0;
    const cell = (b, c, r) => (b >> BigInt(c * H1 + r)) & 1n;
    for (let c = 0; c < W; c++) for (let r = 0; r < H; r++) {
      for (const [dc, dr] of [[1, 0], [0, 1], [1, 1], [1, -1]]) {
        const ec = c + 3 * dc, er = r + 3 * dr;
        if (ec < 0 || ec >= W || er < 0 || er >= H) continue;
        let a = 0, b = 0;
        for (let k = 0; k < 4; k++) { if (cell(me, c + k * dc, r + k * dr)) a++; else if (cell(op, c + k * dc, r + k * dr)) b++; }
        if (a && !b) sc += a === 3 ? 5 : a === 2 ? 2 : 0;
        else if (b && !a) sc -= b === 3 ? 5 : b === 2 ? 2 : 0;
      }
    }
    for (let r = 0; r < H; r++) { if (cell(me, 3, r)) sc += 3; if (cell(op, 3, r)) sc -= 3; }
    return sc;
  }
  let nodes = 0, deadline = 0, stop = false;
  function negamax(s, depth, alpha, beta) {
    if ((++nodes & 4095) === 0 && Date.now() > deadline) stop = true;
    if (stop) return 0;
    if (s.n === W * H) return 0;
    for (let c = 0; c < W; c++) if (canPlay(s, c) && isWin(s, c)) return 1000 - s.n;
    if (depth === 0) return evalPos(s);
    let best = -1e9;
    for (const c of ORDER) {
      if (!canPlay(s, c)) continue;
      const v = -negamax(play(s, c), depth - 1, -beta, -alpha);
      if (v > best) best = v;
      if (v > alpha) alpha = v;
      if (alpha >= beta) break;
    }
    return best;
  }
  function search(moves, maxDepth, time) {
    let s = { cur: 0n, mask: 0n, n: 0 };
    for (const c of moves) s = play(s, c);
    nodes = 0; stop = false; deadline = Date.now() + time;
    let best = ORDER.find(c => canPlay(s, c)), scores = [];
    for (const c of ORDER) if (canPlay(s, c) && isWin(s, c)) return { move: c, scores: [[c, 1000]], depth: 0 };
    let reached = 0;
    for (let d = 1; d <= maxDepth; d++) {
      const sc = [];
      for (const c of ORDER) { if (!canPlay(s, c)) continue; sc.push([c, -negamax(play(s, c), d - 1, -1e9, 1e9)]); if (stop) break; }
      if (stop) break;
      sc.sort((a, b) => b[1] - a[1]); scores = sc; best = sc[0][0]; reached = d;
      if (Math.abs(sc[0][1]) > 900) break;
    }
    return { move: best, scores, depth: reached };
  }
  return { W, H, H1, play, canPlay, won, search, isWin };
}

const E = C4ENGINE();
const $ = id => document.getElementById(id);
const svg = $("board"), NS = "http://www.w3.org/2000/svg", STORE = "connect4-v1";
let S = null, G = null, thinking = false, token = 0, pending = null;
const name = p => (p === 1 ? "紅" : "黃");
function defaults() { return { mode: "ai", humanFirst: true, level: 2, lvV: 2, moves: [], over: null, tally: { r: 0, y: 0, d: 0 } }; }
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) { } }

/* 盤面陣列 grid[c][r]（r=0 最下面），以及勝負與連線位置 */
function replay() {
  const grid = Array.from({ length: 7 }, () => []);
  let turn = 1, result = 0, line = null;
  for (const c of S.moves) {
    grid[c].push(turn);
    const r = grid[c].length - 1, l = fourAt(grid, c, r, turn);
    if (l) { result = turn; line = l; }
    turn = 3 - turn;
  }
  if (!result && S.moves.length === 42) result = 3;
  return { grid, turn, result, line };
}
function fourAt(grid, c, r, p) {
  const at = (c, r) => (c >= 0 && c < 7 && r >= 0 && r < 6 ? grid[c][r] : 0);
  for (const [dc, dr] of [[1, 0], [0, 1], [1, 1], [1, -1]]) {
    const cells = [[c, r]];
    for (let k = 1; at(c + k * dc, r + k * dr) === p; k++) cells.push([c + k * dc, r + k * dr]);
    for (let k = 1; at(c - k * dc, r - k * dr) === p; k++) cells.unshift([c - k * dc, r - k * dr]);
    if (cells.length >= 4) return cells;
  }
  return null;
}
const humanTurn = () => S.mode === "online" ? !!(NETP && NETP.myTurn()) : (S.mode === "local" || (G.turn === 1) === S.humanFirst);
const NETP_turnSeat = () => (G.turn === 1 ? 0 : 1);
const aiTurn = () => S.mode === "ai" && !S.over && !humanTurn();
function play(c) {
  if (G.grid[c].length >= 6) return;
  S.moves.push(c); G = replay();
  if (G.result) finish(G.result);
  if (S.mode === "online" && NETP) NETP.push();
  save(); render(); maybeAi();
}
function finish(r) {
  S.over = { r };
  if (r === 3) S.tally.d++; else if (r === 1) S.tally.r++; else S.tally.y++;
  stamp(r === 3 ? "和局" : `${name(r)}贏`, S.mode === "ai" && r !== 3 ? ((r === 1) === S.humanFirst ? "你贏了" : "電腦贏了") : "");
}
function stamp(big, small) {
  const box = $("fx"); box.innerHTML = "";
  const d = document.createElement("div"); d.className = "stamp";
  d.innerHTML = `<span class="big">${big}</span>` + (small ? `<span class="small">${small}</span>` : "");
  box.appendChild(d);
}

let worker = null;
try { worker = new Worker(URL.createObjectURL(new Blob([`const E=(${C4ENGINE.toString()})();onmessage=e=>{const d=e.data;postMessage({id:d.id,r:E.search(d.moves,d.depth,d.time)});};`], { type: "text/javascript" }))); } catch (e) { worker = null; }
let reqId = 0; const waiting = new Map();
if (worker) worker.onmessage = e => { const cb = waiting.get(e.data.id); waiting.delete(e.data.id); if (cb) cb(e.data.r); };
const LV = [{ depth: 2, time: 300, noise: 0.45 }, { depth: 4, time: 600, noise: 0.25 }, { depth: 6, time: 900, noise: 0.08 }, { depth: 9, time: 1500, noise: 0.03 }, { depth: 14, time: 2200, noise: 0 }, { depth: 42, time: 3500, noise: 0 }];   // 10-28：6 級
function maybeAi() {
  if (!aiTurn()) return;
  thinking = true; render();
  const my = token, L = LV[S.level], id = ++reqId, t0 = Date.now();
  const done = r => {
    if (my !== token) return;
    setTimeout(() => {
      if (my !== token) return;
      thinking = false;
      let c = r.move;
      if (Math.random() < L.noise && r.scores.length > 1) {          // 偶爾挑第二、三好的（但不送對方直接贏）
        const ok = r.scores.filter(x => x[1] > -900);
        if (ok.length) c = ok[Math.min(ok.length - 1, 1 + ((Math.random() * 2) | 0))][0];
      }
      play(c);
    }, Math.max(0, 350 - (Date.now() - t0)));
  };
  if (worker) { waiting.set(id, done); worker.postMessage({ id, moves: S.moves.slice(), depth: L.depth, time: L.time }); }
  else setTimeout(() => done(E.search(S.moves.slice(), Math.min(L.depth, 6), 500)), 30);
}

function el(t, a, p) { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
let hoverCol = -1;
function draw() {
  svg.innerHTML = "";
  const defs = el("defs", {}, svg);
  const mk = (id, a, b) => { const g = el("radialGradient", { id, cx: ".38", cy: ".32", r: ".75" }, defs); el("stop", { offset: 0, "stop-color": a }, g); el("stop", { offset: 1, "stop-color": b }, g); };
  mk("gr", "#f26a5d", "#a3221a"); mk("gy", "#ffe37a", "#d4a015");
  const X = c => 60 + c * 96, Y = r => 590 - r * 92;
  if (hoverCol >= 0 && !S.over && !thinking && humanTurn() && G.grid[hoverCol].length < 6)
    el("circle", { cx: X(hoverCol), cy: 34, r: 30, fill: G.turn === 1 ? "url(#gr)" : "url(#gy)", opacity: .55 }, svg);
  el("rect", { x: 6, y: 72, width: 688, height: 562, rx: 22, fill: "#2e5fa8" }, svg);
  const last = S.moves.length ? S.moves[S.moves.length - 1] : -1;
  for (let c = 0; c < 7; c++) for (let r = 0; r < 6; r++) {
    const v = G.grid[c][r];
    el("circle", { cx: X(c), cy: Y(r), r: 38, fill: v ? (v === 1 ? "url(#gr)" : "url(#gy)") : "var(--ground)", stroke: "#1d3f73", "stroke-width": 3 }, svg);
    if (v && c === last && r === G.grid[c].length - 1) el("circle", { cx: X(c), cy: Y(r), r: 9, fill: "#fff", opacity: .85 }, svg);
  }
  if (G.line) for (const [c, r] of G.line) el("circle", { cx: X(c), cy: Y(r), r: 31, fill: "none", stroke: "#fff", "stroke-width": 6 }, svg);
}
function render() { render0(); if (typeof onlineOverlay === "function" && NETP) onlineOverlay(); }
function render0() {
  draw();
  const pr = (sel, attr, val) => document.querySelectorAll(sel + " button").forEach(b => b.setAttribute("aria-pressed", b.dataset[attr] === String(val)));
  pr("#modeSeg", "mode", S.mode); pr("#sideSeg", "first", S.humanFirst ? 1 : 0); pr("#lvlSeg", "lv", S.level);
  $("aiOpts").hidden = S.mode !== "ai";
  let msg;
  if (S.over) msg = S.over.r === 3 ? "和局" : S.over.resign ? `${name(3 - S.over.r)}認輸，${name(S.over.r)}贏` : `${name(S.over.r)}贏了`;
  else if (thinking) msg = "電腦思考中…";
  else msg = S.mode === "ai" ? (humanTurn() ? `輪到你（${name(G.turn)}）` : "電腦") : `輪到${name(G.turn)}`;
  $("msg").textContent = msg;
  $("sub").textContent = S.over ? "按「新局」再來一盤" : `第 ${S.moves.length + 1} 手｜點一行投子`;
  $("score").innerHTML = `<span>紅贏 <b>${S.tally.r}</b></span><span>黃贏 <b>${S.tally.y}</b></span><span>和 <b>${S.tally.d}</b></span>`;
  $("btnUndo").disabled = !S.moves.length;
  $("btnGiveUp").disabled = !!S.over || !S.moves.length;
}

function colOf(evt) {
  const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  const c = Math.floor((p.x - 12) / 96); return c >= 0 && c < 7 ? c : -1;
}
svg.addEventListener("click", evt => { if (S.over || thinking || !humanTurn()) return; const c = colOf(evt); if (c >= 0) play(c); });
svg.addEventListener("pointermove", evt => { const c = colOf(evt); if (c !== hoverCol) { hoverCol = c; draw(); } });
svg.addEventListener("pointerleave", () => { hoverCol = -1; draw(); });
function ask(text, yes) { pending = yes; $("confirmText").textContent = text; $("confirm").hidden = false; }
$("confirmYes").onclick = () => { $("confirm").hidden = true; const f = pending; pending = null; if (f) f(); };
$("confirmNo").onclick = () => { $("confirm").hidden = true; pending = null; };
function newGame() { token++; thinking = false; S.moves = []; S.over = null; $("fx").innerHTML = ""; G = replay(); save(); render(); maybeAi(); }
$("btnNew").onclick = () => (S.moves.length && !S.over ? ask("放棄這盤、重新開始？", newGame) : newGame());
$("btnUndo").onclick = () => {
  if (!S.moves.length) return;
  token++; thinking = false; $("fx").innerHTML = "";
  if (S.over) { if (S.over.resign) { S.over = null; G = replay(); save(); render(); return; } const r = S.over.r; if (r === 3) S.tally.d--; else if (r === 1) S.tally.r--; else S.tally.y--; S.over = null; }
  S.moves.pop(); G = replay();
  if (S.mode === "ai") while (S.moves.length && !humanTurn()) { S.moves.pop(); G = replay(); }
  save(); render(); maybeAi();
};
$("btnGiveUp").onclick = () => ask("認輸這盤？", () => {
  token++; thinking = false;
  const loser = S.mode === "ai" ? (S.humanFirst ? 1 : 2) : G.turn, w = 3 - loser;
  S.over = { r: w, resign: true }; if (w === 1) S.tally.r++; else S.tally.y++;
  stamp(`${name(w)}贏`, `${name(loser)}認輸`); save(); render();
});
const bind = (sel, f) => document.querySelectorAll(sel + " button").forEach(b => b.onclick = () => f(b.dataset));
bind("#modeSeg", d => { if (d.mode === S.mode) return; if (S.mode === "online" && NETP && NETP.active()) NETP.leave(); S.mode = d.mode; token++; thinking = false; save(); render(); maybeAi(); });
bind("#sideSeg", d => { const f = d.first === "1"; if (f === S.humanFirst) return; S.humanFirst = f; token++; thinking = false; save(); render(); maybeAi(); });
bind("#lvlSeg", d => { S.level = +d.lv; save(); render(); });

/* ───────── 連線對戰（net.js，兩支手機直接連線） ───────── */
function onlineUndoFor(seat) {
  const keep = S.moves.slice(); let mv = S.moves.slice();
  do { mv.pop(); S.moves = mv.slice(); G = replay(); } while (mv.length && NETP_turnSeat() !== seat);
  S.moves = keep; G = replay();
  return mv;
}
function onlineApply(st, remote) {
  const was = !!S.over;
  
  S.moves = (st.moves || []).slice(); S.over = null; 
  G = replay();
  if (st.over) {
    if (!was) { finish(st.over.r); }
    if (!was && st.over.resign) {                       // 認輸：小字改成誰認輸
      const box = document.querySelector("#fx .stamp");
      if (box) { let sm = box.querySelector(".small"); if (!sm) { sm = document.createElement("span"); sm.className = "small"; box.appendChild(sm); } sm.textContent = remote ? "對方認輸" : "你認輸"; }
    }
    S.over = st.over;
  } else $("fx").innerHTML = "";
  save(); render();
}
NETP = NetPlay.widget({
  game: "connect4", el: $("netBox"), sides: ["紅（先下）", "黃"],
  adapter: {
    getState: () => ({ moves: S.moves.slice(), over: S.over || null, cfg: null }),
    setState: onlineApply,
    turnSeat: () => NETP_turnSeat(),
    undoFor: onlineUndoFor,
    newCfg: () => (null),
    resignOver: seat => ({ r: seat === 0 ? 2 : 1, resign: true }),
    
    onEnter(seat) { S.mode = "online"; token++; thinking = false;  save(); render(); },
    onLeave() { S.mode = "local"; S.moves = []; S.over = null; $("fx").innerHTML = ""; G = replay(); save(); render(); },
  },
  onWantOnline() { S.mode = "online"; render(); },
  onRender() { onlineOverlay(); },
});
function onlineOverlay() {
  const on = S.mode === "online";
  $("netBox").hidden = !on;
  if (!on) return;
  $("aiOpts").hidden = true;
  const act = NETP && NETP.active();
  if (!S.over) $("msg").textContent = !act ? "連線對戰：開房間，或輸入對方的房號" : !NETP.connected() ? "等對手連線…" : NETP.myTurn() ? "輪到你" : "等對手下…";
  $("btnUndo").disabled = !act || !S.moves.length || !!S.over;
  $("btnGiveUp").disabled = !act || !!S.over || !S.moves.length;
  
}
{
  const offNew = $("btnNew").onclick, offUndo = $("btnUndo").onclick, offGive = $("btnGiveUp").onclick;
  $("btnNew").onclick = () => S.mode === "online" ? (NETP.active() && ask("跟對方要求重新開一盤？", () => NETP.request("new"))) : offNew();
  $("btnUndo").onclick = () => S.mode === "online" ? (NETP.active() && S.moves.length && NETP.request("undo")) : offUndo();
  $("btnGiveUp").onclick = () => S.mode === "online" ? (NETP.active() && ask("認輸這盤？", () => NETP.resign())) : offGive();
  
}
(function init() {
  let st = null; try { st = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) { }
  S = Object.assign(defaults(), st || {});
  if (st && st.lvV !== 2) { S.level = [0, 2, 5][S.level] ?? 2; S.lvV = 2; }     // 舊存檔（3 級）換成 6 級的編號
  try { G = replay(); } catch (e) { S.moves = []; S.over = null; G = replay(); }
  render(); if (!S.over) maybeAi();
})();
</script>
