<title>燼之深處</title>
<style>

<div id="wrap"><canvas id="cv"></canvas></div>
<div id="touch">
  <div id="pad"><div id="knob"></div></div>
  <div class="tb" data-k="jump" style="right:22px;bottom:26px;width:72px;height:72px">跳</div>
  <div class="tb" data-k="atk" style="right:106px;bottom:18px">攻</div>
  <div class="tb" data-k="dash" style="right:34px;bottom:110px">衝</div>
  <div class="tb" data-k="heal" style="right:110px;bottom:90px">回</div>

</div>

<script>
'use strict';
// 燼之深處 —— 類銀河城小原型（2026-10-16）。一個檔案、canvas 畫圖、沒有外部素材。
const TS = 16, VW = 480, VH = 270, STEP = 1 / 120;
const G = 1500, MAXFALL = 430, RUN = 135, JUMPV = 490, DASHV = 380, DASHT = .16, SOULMAX = 99, HEALCOST = 33;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), menu = $('menu');
const fl = Math.floor, clamp = (v, a, b) => v < a ? a : v > b ? b : v, sgn = v => v > 0 ? 1 : v < 0 ? -1 : 0;
const ov = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function rng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

// ---------- 狀態 ----------
let K = 1, CSS = 1, tileCache = null, bgShapes = [];
let scene = 'title', paused = false, room = null, roomId = 'A', ents = [], objs = [], haz = [], parts = [];
let fade = null, modal = null, banner = null, hitstop = 0, shake = 0, T = 0, playTime = 0, deaths = 0;
let flags, bench, p, cam = { x: 0, y: 0 }, wallHits = 0;
const KB = {}, TOUCH = {}, IN = {};
let Q = {}, PR = {};
const take = k => !!PR[k];
function resize() {
  CSS = Math.min(innerWidth / VW, innerHeight / VH); K = CSS * (devicePixelRatio || 1);
  cv.width = Math.round(VW * K); cv.height = Math.round(VH * K);
  cv.style.width = Math.round(VW * CSS) + 'px'; cv.style.height = Math.round(VH * CSS) + 'px';
  tileCache = null;
}
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');

// ---------- 地圖 ----------
function mk(w, h) { const g = []; for (let y = 0; y < h; y++) { const r = []; for (let x = 0; x < w; x++) r.push(x === 0 || y === 0 || x === w - 1 || y === h - 1 ? '#' : '.'); g.push(r); } return g; }
function fill(g, x0, y0, x1, y1, c) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) g[y][x] = c; }
// pal: 背景上、背景下、牆面、邊緣亮色、牆內深色
const ROOMS = {
  A: { name: '灰燼門', pal: ['#18202d', '#090c12', '#2b3547', '#55688a', '#151b26'],
    build() { const g = mk(40, 17); fill(g, 1, 15, 38, 15, '#'); fill(g, 39, 12, 39, 14, '.'); fill(g, 14, 11, 17, 11, '='); fill(g, 21, 8, 24, 8, '='); fill(g, 29, 13, 32, 14, '#'); return g; },
    ents: [['crawler', 22, 14]],
    objs: [['sign', 4, 14, '←→ 移動　Z／空白 跳（按住跳更高）　X 攻擊', '左下搖桿移動　「跳」按住跳更高　「攻」攻擊'], ['bench', 9, 14], ['sign', 35, 14, '打中敵人會累積「魂」（左上圓球）　按住 V 回一格血', '打中敵人會累積「魂」（左上圓球）　按住「回」回一格血']],
    exits: [{ s: 'R', y0: 12, y1: 14, to: 'B', dy: 0 }] },
  B: { name: '荊棘長廊', pal: ['#14201d', '#070d0b', '#26392f', '#58806a', '#111a16'],
    build() { const g = mk(50, 17); fill(g, 1, 15, 48, 15, '#'); fill(g, 10, 15, 18, 15, '^'); fill(g, 23, 15, 32, 15, '^'); fill(g, 0, 12, 0, 14, '.'); fill(g, 49, 12, 49, 14, '.'); fill(g, 13, 12, 15, 12, '='); fill(g, 26, 12, 28, 12, '='); return g; },
    ents: [['crawler', 6, 14], ['crawler', 40, 14], ['flyer', 30, 7]],
    objs: [['sign', 3, 14, '空中按 ↓＋攻擊＝下劈：打到敵人或尖刺會彈起來', '空中 搖桿↓＋「攻」＝下劈：打到敵人或尖刺會彈起來']],
    exits: [{ s: 'L', y0: 12, y1: 14, to: 'A', dy: 0 }, { s: 'R', y0: 12, y1: 14, to: 'C', dy: -7 }] },
  C: { name: '墜落豎井', pal: ['#111729', '#05070d', '#232d4a', '#5163a0', '#0e1220'],
    build() {
      const g = mk(30, 49);
      fill(g, 0, 5, 0, 7, '.'); fill(g, 29, 5, 29, 7, '.'); fill(g, 0, 43, 0, 45, '.');
      fill(g, 1, 8, 10, 8, '='); fill(g, 19, 8, 28, 45, '#'); fill(g, 1, 46, 28, 47, '#');
      for (const [r, c] of [[12, 3], [16, 11], [20, 3], [24, 11], [28, 3], [32, 11], [36, 3], [40, 11], [43, 3]]) fill(g, c, r, c + 4, r, '=');
      return g;
    },
    ents: [['flyer', 9, 18], ['flyer', 8, 31], ['crawler', 14, 45]],
    objs: [['sign', 3, 7, '對岸太遠了，跳不過去……底下好像有路', '對岸太遠了，跳不過去……底下好像有路'], ['bench', 24, 7]],
    exits: [{ s: 'L', y0: 5, y1: 7, to: 'B', dy: 7 }, { s: 'R', y0: 5, y1: 7, to: 'E', dy: 0 }, { s: 'L', y0: 43, y1: 45, to: 'D', dy: -31 }] },
  D: { name: '靜默聖所', pal: ['#1a1429', '#090711', '#30284a', '#7a68b0', '#140f20'],
    build() { const g = mk(34, 17); fill(g, 1, 15, 32, 15, '#'); fill(g, 33, 12, 33, 14, '.'); fill(g, 1, 1, 6, 10, '#'); fill(g, 6, 11, 6, 14, 'W'); fill(g, 15, 14, 21, 14, '#'); return g; },
    ents: [['crawler', 11, 14], ['crawler', 25, 14]],
    objs: [['shrine', 18, 13], ['mask', 3, 14], ['bench', 29, 14], ['sign', 9, 14, '這面牆有裂縫……', '這面牆有裂縫……']],
    exits: [{ s: 'R', y0: 12, y1: 14, to: 'C', dy: 31 }] },
  E: { name: '燼甲巢穴', pal: ['#241210', '#0b0505', '#4a2419', '#a85a32', '#1b0c09'],
    build() { const g = mk(36, 19); fill(g, 0, 5, 0, 7, '.'); fill(g, 1, 8, 5, 8, '#'); fill(g, 1, 17, 34, 17, '#'); return g; },
    ents: [['boss', 27, 16]], objs: [],
    exits: [{ s: 'L', y0: 5, y1: 7, to: 'C', dy: 0 }] },
};
const tile = (x, y) => (room && y >= 0 && y < room.H && x >= 0 && x < room.W) ? room.g[y][x] : '.';
const isSolid = (x, y) => { const t = tile(x, y); return t === '#' || t === 'W'; };

function loadRoom(id) {
  const R = ROOMS[id]; roomId = id;
  const g = R.build();
  if (flags.broken[id]) for (const r of g) for (let x = 0; x < r.length; x++) if (r[x] === 'W') r[x] = '.';
  if (id === 'E' && flags.boss) { fill(g, 10, 14, 13, 14, '='); fill(g, 6, 11, 9, 11, '='); }
  room = { g, W: g[0].length, H: g.length, pal: R.pal, exits: R.exits };
  ents = []; haz = []; parts = []; wallHits = 0;
  for (const [t, x, y] of R.ents) {
    if (t === 'boss' && flags.boss) continue;
    const e = { type: t, vx: 0, vy: 0, dir: -1, hp: 2, flash: 0, kbT: 0, kbV: 0, hitBy: -1, ph: Math.random() * 6, dead: false, t: 0, state: '' };
    if (t === 'crawler') Object.assign(e, { w: 14, h: 10, x: x * TS + 1, y: (y + 1) * TS - 10, hp: 2 });
    if (t === 'flyer') Object.assign(e, { w: 14, h: 12, x: x * TS + 1, y: y * TS + 2, hp: 2, hx: x * TS + 8, hy: y * TS + 8 });
    if (t === 'boss') Object.assign(e, { w: 38, h: 28, x: x * TS + 8 - 19, y: (y + 1) * TS - 28, hp: 18, max: 18, state: 'sleep' });
    ents.push(e);
  }
  objs = [];
  for (const o of R.objs) {
    const [k, x, y, t1, t2] = o;
    if (k === 'shrine' && flags.dash) continue;
    if (k === 'mask' && flags.mask) continue;
    objs.push({ k, x: x * TS + 8, y: (y + 1) * TS, text: isTouch ? t2 : t1 });
  }
  const r = rng(id.charCodeAt(0) * 7919); bgShapes = [];
  const span = room.W * TS * .5 + VW;
  for (let i = 0; i < 26; i++) bgShapes.push({ x: r() * span, w: 14 + r() * 46, h: 40 + r() * 150, top: r() < .5, layer: r() < .5 ? 0 : 1 });
  tileCache = null;
}

// ---------- 碰撞 ----------
function collideX(e, dx) {
  e.x += dx;
  const y0 = fl(e.y / TS), y1 = fl((e.y + e.h - .01) / TS);
  if (dx > 0) { const tx = fl((e.x + e.w - .01) / TS); for (let ty = y0; ty <= y1; ty++) if (isSolid(tx, ty)) { e.x = tx * TS - e.w; return true; } }
  else if (dx < 0) { const tx = fl(e.x / TS); for (let ty = y0; ty <= y1; ty++) if (isSolid(tx, ty)) { e.x = (tx + 1) * TS; return true; } }
  return false;
}
function collideY(e, dy, oneWay) {
  const prevB = e.y + e.h; e.y += dy;
  const x0 = fl(e.x / TS), x1 = fl((e.x + e.w - .01) / TS);
  if (dy > 0) { const ty = fl((e.y + e.h - .01) / TS); for (let tx = x0; tx <= x1; tx++) if (isSolid(tx, ty) || (oneWay && tile(tx, ty) === '=' && prevB <= ty * TS + .5)) { e.y = ty * TS - e.h; return true; } }
  else if (dy < 0) { const ty = fl(e.y / TS); for (let tx = x0; tx <= x1; tx++) if (isSolid(tx, ty)) { e.y = (ty + 1) * TS; return true; } }
  return false;
}
function tilesIn(b, ch) {
  const out = [];
  for (let ty = fl(b.y / TS); ty <= fl((b.y + b.h - .01) / TS); ty++) for (let tx = fl(b.x / TS); tx <= fl((b.x + b.w - .01) / TS); tx++) if (tile(tx, ty) === ch) out.push([tx, ty]);
  return out;
}

// ---------- 玩家 ----------
function newPlayer() { return { x: 0, y: 0, w: 10, h: 20, vx: 0, vy: 0, face: 1, ground: false, coyote: 0, jbuf: 0, hp: 5, maxHp: 5, soul: 0, inv: 0, atkT: 0, atkCD: 0, atkDir: 'f', swing: 0, wallSwing: -1, pogoSwing: -1, dashT: 0, dashCD: 0, dashDir: 1, canDash: true, healT: 0, kbT: 0, recT: 0, recV: 0, pogoT: 0, dropT: 0, trail: [], walk: 0, restT: 0, safe: { x: 0, y: 0 } }; }
function hitbox() {
  const P = p;
  if (P.atkDir === 'u') return { x: P.x - 8, y: P.y - 24, w: 26, h: 26 };
  if (P.atkDir === 'd') return { x: P.x - 8, y: P.y + P.h - 2, w: 26, h: 24 };
  return P.face > 0 ? { x: P.x + P.w - 2, y: P.y + 1, w: 28, h: 17 } : { x: P.x - 26, y: P.y + 1, w: 28, h: 17 };
}
function onOneWay() {
  const ty = fl((p.y + p.h + 1) / TS); let one = false;
  for (let tx = fl(p.x / TS); tx <= fl((p.x + p.w - .01) / TS); tx++) { const t = tile(tx, ty); if (t === '#' || t === 'W') return false; if (t === '=') one = true; }
  return one;
}

function updPlayer(dt) {
  const P = p;
  P.inv = Math.max(0, P.inv - dt); P.atkCD -= dt; P.dashCD -= dt; P.dropT -= dt; P.coyote -= dt; P.jbuf -= dt; P.kbT -= dt; P.recT -= dt; P.pogoT -= dt; P.restT -= dt;
  if (take('jump')) P.jbuf = .13;
  const dir = (IN.r ? 1 : 0) - (IN.l ? 1 : 0);

  // 回血：站著、按住、魂夠
  if (IN.heal && P.ground && P.soul >= HEALCOST && P.hp < P.maxHp && P.dashT <= 0 && P.kbT <= 0) {
    P.healT += dt;
    if (fl(P.healT * 30) % 3 === 0) parts.push(mkPart(P.x + Math.random() * P.w, P.y + P.h, 0, -40 - Math.random() * 30, .5, '#ffd9a0', 1.2, 0));
    if (P.healT >= .85) { P.healT = 0; P.hp++; P.soul -= HEALCOST; burst(P.x + P.w / 2, P.y + 8, 14, '#ffe2b0', 90); sfx('heal'); }
  } else P.healT = 0;

  if (take('dash') && flags.dash && P.dashCD <= 0 && P.canDash && P.healT === 0 && P.kbT <= 0) {
    P.dashT = DASHT; P.dashDir = dir || P.face; P.face = P.dashDir; P.dashCD = .42; if (!P.ground) P.canDash = false; sfx('dash');
  }
  if (take('atk') && P.atkCD <= 0 && P.dashT <= 0 && P.healT === 0) {
    P.atkT = .12; P.atkCD = .33; P.swing++;
    P.atkDir = IN.u ? 'u' : (IN.d && !P.ground) ? 'd' : 'f';
    sfx('slash');
  }
  if (P.jbuf > 0 && P.dashT <= 0 && P.healT === 0 && P.kbT <= 0) {
    if (IN.d && P.ground && onOneWay()) { P.dropT = .22; P.jbuf = 0; P.ground = false; P.y += 1; }
    else if (P.ground || P.coyote > 0) { P.vy = -JUMPV; P.jbuf = 0; P.coyote = 0; P.ground = false; sfx('jump'); }
  }

  if (P.dashT > 0) {
    P.dashT -= dt; P.vx = P.dashDir * DASHV; P.vy = 0;
    P.trail.push({ x: P.x, y: P.y, f: P.face, a: .5 });
  } else if (P.kbT > 0) { /* 被打退：保持速度 */ }
  else if (P.healT > 0) P.vx = 0;
  else { P.vx = dir * RUN; if (dir && P.atkT <= 0) P.face = dir; }
  if (P.recT > 0 && P.dashT <= 0) P.vx += P.recV;
  if (P.dashT <= 0) { P.vy += G * dt * ((P.vy < 0 && !IN.jump && P.pogoT <= 0 && P.kbT <= 0) ? 2.7 : 1); if (P.vy > MAXFALL) P.vy = MAXFALL; }

  collideX(P, P.vx * dt);
  const wasGround = P.ground; P.ground = false;
  if (collideY(P, P.vy * dt, P.dropT <= 0)) {
    if (P.vy > 0) { P.ground = true; P.canDash = true; if (!wasGround && P.vy > 330) burst(P.x + P.w / 2, P.y + P.h, 5, room.pal[3], 40); }
    P.vy = 0;
  }
  if (P.ground) {
    P.coyote = .08;
    const ty = fl((P.y + P.h + 1) / TS), a = fl(P.x / TS), b = fl((P.x + P.w - .01) / TS);
    if (tile(a, ty) === '#' && tile(b, ty) === '#' && tile(a - 1, ty) !== '^' && tile(b + 1, ty) !== '^') P.safe = { x: P.x, y: P.y };
  }
  if (P.ground && P.vx) P.walk += dt * 10;
  for (const t of P.trail) t.a -= dt * 2.5;
  P.trail = P.trail.filter(t => t.a > 0);

  // 攻擊判定
  if (P.atkT > 0) {
    P.atkT -= dt;
    const hb = hitbox(); let pogo = false;
    for (const e of ents) {
      if (e.dead || e.hitBy === P.swing || e.state === 'sleep' || e.state === 'dying' || !ov(hb, e)) continue;
      e.hitBy = P.swing; hurtEnemy(e);
      if (P.atkDir === 'd') pogo = true;
      else if (P.atkDir === 'f') { P.recT = .08; P.recV = -P.face * 120; }
    }
    if (P.atkDir === 'd' && tilesIn(hb, '^').length) pogo = true;
    if (P.wallSwing !== P.swing && tilesIn(hb, 'W').length) { P.wallSwing = P.swing; hitWall(hb); }
    if (pogo && P.pogoSwing !== P.swing) { P.pogoSwing = P.swing; P.vy = -420; P.pogoT = .2; P.canDash = true; }
  }

  // 尖刺
  if (!fade) {
    let spiked = false;
    for (const [tx, ty] of tilesIn(P, '^')) if (P.y + P.h > ty * TS + 6) spiked = true;
    if (spiked || P.y > room.H * TS + 30) {
      P.hp--; sfx('hurt'); shake = 5; hitstop = .08; P.healT = 0;
      if (P.hp <= 0) die();
      else fadeTo(() => { P.x = P.safe.x; P.y = P.safe.y; P.vx = P.vy = 0; P.dashT = 0; P.kbT = 0; P.inv = .7; updCam(0, true); }, 1.4);
      return;
    }
  }

  // 物件
  for (const o of objs) {
    const near = Math.abs(o.x - (P.x + P.w / 2)) < 16 && Math.abs(o.y - (P.y + P.h)) < 20;
    o.near = near;
    if (o.k === 'bench' && near && P.ground && take('u')) {
      P.hp = P.maxHp; P.restT = 1.2; bench = { room: roomId, x: o.x, y: o.y }; save();
      toast('在長椅休息了　血量全滿・進度已存'); sfx('heal');
      burst(o.x, o.y - 10, 18, '#ffe2b0', 70);
    }
    if (o.k === 'shrine' && !o.gone && ov(P, { x: o.x - 10, y: o.y - 26, w: 20, h: 26 })) {
      o.gone = true; flags.dash = true; save(); sfx('pick'); burst(o.x, o.y - 14, 40, '#ffb35a', 140); shake = 4;
      showModal('燼影衝刺', isTouch ? ['按「衝」向前衝刺，空中也能衝一次', '試著從豎井上方的斷崖衝過去'] : ['按 C／K／Shift 向前衝刺，空中也能衝一次', '試著從豎井上方的斷崖衝過去']);
    }
