<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="棋盤小館"><meta name="theme-color" content="#131917"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style><script>if('serviceWorker' in navigator&&(location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname)))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script><title>棋盤小館</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  /* 棋類首頁（2026-10-13，Gabi：「做一個棋類統整，打開的時候有一個首頁可以選要玩什麼棋」） */
  :root {
    --ground: #e7ece4; --panel: #f5f7f2; --ink: #1d2723; --muted: #5d6b64; --rule: #cbd4cb;
    --jade: #2e7a67; --jade-soft: rgba(46, 122, 103, .16); --accent: #b0261d;
    --wood-a: #e1bd84; --wood-b: #c9995a; --grid: #5b3c1c;
    --f-display: "Ma Shan Zheng", "Kaiti TC", "STKaiti", "BiauKai", serif;
    --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #131917; --panel: #1b2320; --ink: #e2e9e4; --muted: #95a59d; --rule: #2b3732;
      --jade: #5fb59d; --jade-soft: rgba(95, 181, 157, .18); --accent: #e0574b;
      --wood-a: #d3ad74; --wood-b: #b98a4f; --grid: #4d3216;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #131917; --panel: #1b2320; --ink: #e2e9e4; --muted: #95a59d; --rule: #2b3732;
    --jade: #5fb59d; --jade-soft: rgba(95, 181, 157, .18); --accent: #e0574b;
    --wood-a: #d3ad74; --wood-b: #b98a4f; --grid: #4d3216;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { background: var(--ground); color: var(--ink); }
  body { font-family: var(--f-body); font-size: 15px; line-height: 1.55; padding-inline: 16px; padding-block: 22px 32px; margin: 0; }
  .wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 22px; }
  header h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(40px, 9vw, 60px); line-height: 1; margin: 0; letter-spacing: .08em; }
  header p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 12px; }
  a.card { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; padding: 14px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--rule); color: var(--ink); text-decoration: none;
    transition: transform .12s ease, border-color .12s ease; }
  a.card:hover { border-color: var(--jade); transform: translateY(-1px); }
  a.card:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
  a.card svg { width: 64px; height: 64px; border-radius: 10px; display: block; }
  a.card .name { font-weight: 700; font-size: 17px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  a.card .name small { font-weight: 400; color: var(--muted); font-size: 12px; }
  a.card .desc { color: var(--muted); font-size: 13px; line-height: 1.45; margin-top: 2px; }
  a.card .resume { color: var(--jade); font-size: 12px; margin-top: 4px; font-weight: 500; }
  h2 { font-size: 13px; color: var(--muted); letter-spacing: .1em; font-weight: 500; margin: 6px 0 -6px; }
  footer { color: var(--muted); font-size: 12px; }
  @media (prefers-reduced-motion: reduce) { a.card { transition: none; } a.card:hover { transform: none; } }
</style>

<div class="wrap">
  <header>
    <h1>棋盤小館</h1>
    <p>選一種棋開始。每一種都可以兩個人同一支手機輪流下，或跟電腦下；有悔棋，也有玩法說明。沒有網路也能玩。</p>
  </header>
  <h2>東方棋</h2>
  <div class="grid" id="east"></div>
  <h2>西方與經典</h2>
  <div class="grid" id="west"></div>
  <h2>輕鬆玩</h2>
  <div class="grid" id="light"></div>
  <footer>棋局會自動存在這支手機上，下次打開可以接著下。</footer>
</div>

<script>
const W = "var(--wood-a)", G = "var(--grid)";
const ICON = {
  xiangqi: `<rect width="64" height="64" fill="${W}"/><g stroke="${G}" stroke-width="1.4"><path d="M8 14H56M8 32H56M8 50H56M14 8V56M32 8V56M50 8V56"/></g><circle cx="32" cy="32" r="13" fill="#f7ecd2" stroke="#8c6a3b" stroke-width="2"/><text x="32" y="38" font-size="17" text-anchor="middle" fill="#b0261d" font-weight="900" font-family="serif">帥</text>`,
  go: `<rect width="64" height="64" fill="${W}"/><g stroke="${G}" stroke-width="1"><path d="M8 8H56M8 20H56M8 32H56M8 44H56M8 56H56M8 8V56M20 8V56M32 8V56M44 8V56M56 8V56"/></g><circle cx="20" cy="20" r="6" fill="#111"/><circle cx="32" cy="20" r="6" fill="#f4f2ec" stroke="#888"/><circle cx="32" cy="32" r="6" fill="#111"/><circle cx="44" cy="44" r="6" fill="#f4f2ec" stroke="#888"/>`,
  gomoku: `<rect width="64" height="64" fill="${W}"/><g stroke="${G}" stroke-width=".8"><path d="M4 12H60M4 22H60M4 32H60M4 42H60M4 52H60M12 4V60M22 4V60M32 4V60M42 4V60M52 4V60"/></g>${[12, 22, 32, 42, 52].map(v => `<circle cx="${v}" cy="${v}" r="4.4" fill="#111"/>`).join("")}<circle cx="22" cy="42" r="4.4" fill="#f4f2ec" stroke="#888"/>`,
  darkchess: `<rect width="64" height="64" fill="#3f5b49"/><g fill="#1f2d25"><rect x="6" y="6" width="24" height="24" rx="12"/><rect x="34" y="34" width="24" height="24" rx="12"/></g><circle cx="46" cy="18" r="12" fill="#f7ecd2" stroke="#8c6a3b" stroke-width="2"/><text x="46" y="23.5" font-size="14" text-anchor="middle" fill="#b0261d" font-weight="900" font-family="serif">炮</text><circle cx="18" cy="46" r="12" fill="#f7ecd2" stroke="#8c6a3b" stroke-width="2"/><text x="18" y="51.5" font-size="14" text-anchor="middle" fill="#1b1d1c" font-weight="900" font-family="serif">將</text>`,
  chess: `<rect width="64" height="64" fill="#e8dcc4"/>${[0, 1, 2, 3].map(r => [0, 1, 2, 3].map(c => (r + c) % 2 ? `<rect x="${c * 16}" y="${r * 16}" width="16" height="16" fill="#9a7650"/>` : "").join("")).join("")}<text x="32" y="44" font-size="34" text-anchor="middle" fill="#111" stroke="#f3ead6" stroke-width="1.2">♞</text>`,
  othello: `<rect width="64" height="64" fill="#2f7a4f"/><g stroke="#1d4f33" stroke-width="1"><path d="M16 4V60M32 4V60M48 4V60M4 16H60M4 32H60M4 48H60"/></g><circle cx="24" cy="24" r="6.5" fill="#f4f2ec"/><circle cx="40" cy="24" r="6.5" fill="#111"/><circle cx="24" cy="40" r="6.5" fill="#111"/><circle cx="40" cy="40" r="6.5" fill="#f4f2ec"/>`,
  checkers: `<rect width="64" height="64" fill="${W}"/>${[[32, 10], [27, 18], [37, 18], [22, 26], [32, 26], [42, 26], [17, 34], [27, 34], [37, 34], [47, 34], [22, 42], [32, 42], [42, 42], [27, 50], [37, 50], [32, 58]].map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="3.6" fill="${i < 3 ? "#b0261d" : i > 12 ? "#2e5fa8" : "#5b3c1c55"}"/>`).join("")}`,
  ooxx: `<rect width="64" height="64" fill="var(--panel)"/><g stroke="var(--muted)" stroke-width="2.4" stroke-linecap="round"><path d="M24 10V54M40 10V54M10 24H54M10 40H54"/></g><g stroke="#b0261d" stroke-width="3" stroke-linecap="round"><path d="M12 12L20 20M20 12L12 20M44 44L52 52M52 44L44 52"/></g><circle cx="32" cy="32" r="5" fill="none" stroke="#2e5fa8" stroke-width="3"/><circle cx="48" cy="16" r="5" fill="none" stroke="#2e5fa8" stroke-width="3"/>`,
  connect4: `<rect width="64" height="64" rx="6" fill="#2e5fa8"/>${[0, 1, 2, 3].map(r => [0, 1, 2, 3, 4].map(c => `<circle cx="${9 + c * 11.5}" cy="${12 + r * 13}" r="4.6" fill="${r === 3 && c < 4 ? "#e8b923" : r === 2 && c === 1 ? "#b0261d" : r === 3 && c === 4 ? "#b0261d" : "#dfe7f2"}"/>`).join("")).join("")}`,
};
const GAMES = [
  ["east", "xiangqi", "xiangqi.html", "象棋", "楚河漢界", "紅黑對弈，長將、長捉、和棋都照規則判。", "xiangqi-v2"],
  ["east", "go", "go.html", "圍棋", "黑白縱橫", "9／13／19 路，可以讓子，中國規則數子。", "go-v1"],
  ["east", "darkchess", "darkchess.html", "暗棋", "翻棋", "半張象棋盤，棋子全部蓋著，翻開才知道是什麼。", "darkchess-v1"],
  ["east", "gomoku", "gomoku.html", "五子棋", "連珠", "先連成五子就贏；可以選擇黑棋禁手。", "gomoku-v1"],
  ["west", "chess", "chess.html", "西洋棋", "國際象棋", "入堡、吃過路兵、升變、和棋規則都有。", "chess-v1"],
  ["west", "othello", "othello.html", "黑白棋", "奧賽羅", "夾住對方就翻面，最後子多的贏。", "othello-v1"],
  ["west", "checkers", "checkers.html", "跳棋", "星形跳棋", "一格一格走或連續跳，先把棋子全部送到對面的贏。", "checkers-v1"],
  ["light", "ooxx", "ooxx.html", "OOXX", "井字棋＋超級井字", "經典三連線；進階模式是 9 個井字組成的大井字。", "ooxx-v1"],
  ["light", "connect4", "connect4.html", "四子棋", "屏風式", "棋子從上面掉下去，橫、直、斜連成四個就贏。", "connect4-v1"],
];
for (const [sec, ic, href, name, sub, desc, key] of GAMES) {
  let resume = "";
  try { const s = JSON.parse(localStorage.getItem(key) || "null"); if (s && Array.isArray(s.moves) && s.moves.length && !s.over && !s.result) resume = `<div class="resume">接著下（${s.moves.length} 手）</div>`; } catch (e) { }
  const a = document.createElement("a");
  a.className = "card"; a.href = href;
  a.innerHTML = `<svg viewBox="0 0 64 64" aria-hidden="true">${ICON[ic]}</svg><div><div class="name">${name}<small>${sub}</small></div><div class="desc">${desc}</div>${resume}</div>`;
  document.getElementById(sec).appendChild(a);
}
</script>
